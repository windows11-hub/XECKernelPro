name: Build Manager

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev", "ci" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksud-extra.yml'
      - '.github/scripts/setup-rust-build.sh'
      - 'repack_apk.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'Cargo.lock'
      - 'Cargo.toml'

jobs:
  build-lkm:
    uses: ./.github/workflows/build-lkm.yml

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit]
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
          - target: x86_64-linux-android
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      pack_lkm: true
      pack_ksuinit: true

  build-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        shell: bash
        run: |
          set -uo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "${SDK_ROOT}" ] || [ ! -d "${SDK_ROOT}" ]; then
            SDK_ROOT=""
            for d in /usr/local/lib/android/sdk /opt/android-sdk /opt/android "$HOME/Android/Sdk" "$HOME/android-sdk"; do
              if [ -d "$d" ]; then SDK_ROOT="$d"; break; fi
            done
          fi
          if [ -z "${SDK_ROOT}" ]; then
            echo "::error::no Android SDK found on this runner"
            exit 1
          fi
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMGR="$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "${SDKMGR}" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          echo "$(dirname "${SDKMGR}")" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          yes | "${SDKMGR}" --sdk_root="${SDK_ROOT}" --licenses > /dev/null 2>&1 || true
          for pkg in "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"; do
            "${SDKMGR}" --sdk_root="${SDK_ROOT}" --install "${pkg}" \
              || echo "::warning::sdkmanager could not install '${pkg}'"
          done

      - name: Build with Gradle (unsigned)
        shell: bash
        run: |
          set +e
          ./gradlew clean assembleRelease 2>&1 | tee /tmp/gradle-build.log
          STATUS="${PIPESTATUS[0]}"
          if [ "${STATUS}" -ne 0 ]; then
            grep -nE "(^|[[:space:]])[ew]: |error:|What went wrong|Execution failed for task|Caused by" /tmp/gradle-build.log | head -n 25
            tail -n 20 /tmp/gradle-build.log
            exit "${STATUS}"
          fi

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v7
        with:
          name: manager-unsigned
          path: manager/app/build/outputs/apk/release/*.apk
